services:
  presenca-juridica-web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_BACKEND_PROVIDER: ${VITE_BACKEND_PROVIDER:-supabase}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-http://localhost:8080}
        VITE_USE_MOCK_DATA: ${VITE_USE_MOCK_DATA:-false}
    image: presenca-juridica-web:local
    restart: unless-stopped
    ports:
      - "${CRM_WEB_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
